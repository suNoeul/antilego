name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'spikes/**'
      - 'data/derived/places.ko.overrides.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'spikes/**'
      - 'data/derived/places.ko.overrides.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 기본은 읽기만. Pages 쓰기·OIDC 는 deploy job 에서만 준다 (리뷰 F15).
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test data, reading, maps and accessibility
        run: node spikes/11-reading-context/verify/run.mjs

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # 캐시 버스팅: 소스에는 리터럴 __V__ 가 남고, 배포본에서만 커밋 SHA 로 바뀐다.
      # GitHub Pages 가 10분 캐시를 주기 때문에 이게 없으면 새 index.html + 옛 app.js
      # 조합으로 흰 화면이 나온다.
      - name: Stamp version (__V__ → commit SHA)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" web/index.html web/app.js web/map.js web/terrain.js web/context-panel.js
          echo "version = $V"
          grep -o 'app\.js?v=[0-9a-f]*' web/index.html
      - name: Upload artifact (web/ only)
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
