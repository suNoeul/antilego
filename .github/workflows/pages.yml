name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # 캐시 버스팅: 소스에는 리터럴 __V__ 가 남고, 배포본에서만 커밋 SHA 로 바뀐다.
      # GitHub Pages 가 10분 캐시를 주기 때문에 이게 없으면 새 index.html + 옛 app.js
      # 조합으로 흰 화면이 나온다.
      - name: Stamp version (__V__ → commit SHA)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" web/index.html web/app.js
          echo "version = $V"
          grep -o 'app\.js?v=[0-9a-f]*' web/index.html
      - name: Upload artifact (web/ only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
