<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antilego — 읽기</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css?v=__V__">
</head>
<body>

<header class="topbar">
  <nav class="topbar-in">
    <button id="loc" class="loc" type="button" aria-haspopup="dialog"
            aria-expanded="false" aria-controls="picker">
      <span id="loc-text"></span><span class="loc-chev" aria-hidden="true">▸</span>
    </button>
    <!-- 역본 고르기 (Spike 08-b). 역본이 하나뿐이면 통째로 숨는다. -->
    <span class="verwrap">
      <button id="verbtn" class="verbtn" type="button" aria-haspopup="menu"
              aria-expanded="false" aria-controls="vermenu" hidden>
        <span id="verbtn-text"></span><span class="loc-chev" aria-hidden="true">▸</span>
      </button>
      <div id="vermenu" class="vermenu" role="menu" aria-label="역본" hidden></div>
    </span>
    <button id="btn-prev" class="ghost" type="button" aria-label="이전 장">‹</button>
    <button id="btn-next" class="ghost" type="button" aria-label="다음 장">›</button>
    <span class="grow"></span>
    <button id="btn-theme" class="ghost" type="button" aria-label="다크 모드" aria-pressed="false">☾</button>
  </nav>
</header>


<!-- 성경 찾기 (Spike 04). 데스크톱 ≥900px 은 상단바 아래 팝오버, 그 아래는 전체 화면 시트.
     기본 닫힘. `#loc` · `/` · `g` 로 연다. -->
<div id="picker" class="picker" role="dialog" aria-modal="true" aria-label="성경 찾기"
     data-step="1" hidden>
  <div class="pick-head">
    <button id="pick-back" class="pick-back" type="button" hidden>← 뒤로</button>
    <span id="pick-crumb" class="pick-crumb"></span>
    <span class="grow"></span>
    <button id="pick-x" class="pick-x" type="button" aria-label="닫기">×</button>
  </div>
  <div class="pick-qrow">
    <input id="pick-q" class="pick-q" type="text" autocomplete="off" autocapitalize="off"
           spellcheck="false" aria-label="책 이름으로 찾기"
           aria-controls="col-book"
           placeholder="책 이름 · 약어 · 영문 · 예: 삿 9:3">
  </div>
  <div id="pick-chips" class="pick-chips" role="group" aria-label="초성"></div>
  <div class="pick-cols">
    <section class="pick-colwrap" data-col="1">
      <h2 class="pick-colhead">성경권</h2>
      <div id="col-book" class="pick-col pick-books" role="listbox"
           aria-label="성경권"></div>
    </section>
    <section class="pick-colwrap" data-col="2">
      <h2 class="pick-colhead">장<span id="head-ch" class="colhead-sub"></span></h2>
      <div id="col-ch" class="pick-col pick-nums" role="listbox" aria-label="장"></div>
    </section>
    <section class="pick-colwrap" data-col="3">
      <h2 class="pick-colhead">절<span id="head-v" class="colhead-sub"></span></h2>
      <!-- 모바일 3단계 전용. 데스크톱의 `Enter`(장만 고르고 그 장 1절로) 와 같은 길이다. -->
      <button id="pick-whole" class="pick-whole" type="button" hidden></button>
      <div id="col-v" class="pick-col pick-nums" role="listbox" aria-label="절"></div>
    </section>
  </div>
</div>

<main class="cols">
  <article class="read">
    <h1 id="title" class="title"></h1>
    <div id="verses" class="verses"></div>
  </article>
</main>

<footer class="attr">
  <!-- 지금 보고 있는 역본의 출처 한 줄 (08-b). 출처 목록에 이미 같은 줄이 있으면 숨는다. -->
  <p id="attr-ver" class="attr-ver" hidden></p>
  <p id="attr-line"></p>
  <p class="attr-fb">읽다가 이상하면 오른쪽 '피드백' 버튼을 눌러 주세요.</p>
</footer>

<!-- 지도 패널 하나. 기본 닫힘. -->
<div id="scrim" class="scrim"></div>

<!-- 플로팅 알약 둘. 데스크톱은 오른쪽 가장자리에 세로로(지도 위 · 피드백 아래),
     모바일은 오른쪽 아래에 가로로(피드백 왼쪽 · 지도 오른쪽). 패널이 열리면 같이 옮겨 붙는다. -->
<div class="fabs">
  <button id="btn-map" class="fab" type="button" aria-expanded="false" aria-controls="panel">지도</button>
  <button id="btn-fb" class="fab fab-2" type="button" aria-expanded="false" aria-controls="fb-card">피드백</button>
</div>

<!-- 패널 왼쪽 가장자리. 끌면 지도가 넓어진다. ≥1200px(밀어내기 모드)에서만 나타난다. -->
<div id="resizer" class="resizer" role="separator" aria-orientation="vertical"
     aria-label="지도 패널 폭" aria-controls="panel" tabindex="0"
     aria-valuemin="400" aria-valuenow="400" aria-valuemax="400"></div>

<aside id="panel" class="panel" aria-label="지도 패널">
  <div id="grip" class="grip" aria-hidden="true"><span></span></div>
  <div class="panel-in">
    <div class="map-wrap">
      <svg id="map" class="panel-map"></svg>
      <span id="era-badge" class="era-badge" hidden>대략</span>
      <div class="zoom-ctl">
        <button id="z-era" class="zbtn zbtn-txt" type="button" aria-pressed="false"
                aria-label="시대 영역 표시">시대</button>
        <button id="z-in" class="zbtn" type="button" aria-label="확대">+</button>
        <button id="z-out" class="zbtn" type="button" aria-label="축소">−</button>
        <button id="z-reset" class="zbtn" type="button" aria-label="원래대로">⟲</button>
      </div>
    </div>
    <p id="era-empty" class="era-empty" hidden>이 장은 시대를 특정하지 않아 영역을 표시하지 않습니다</p>
    <div id="place-block" class="place-block"></div>
    <div id="era-caption" class="era-caption" hidden></div>
    <p id="panel-attr" class="panel-attr"></p>
  </div>
</aside>

<!-- 피드백 (Spike 05-b). 데스크톱 ≥900px 은 버튼 옆 360px 팝오버, 그 아래는 전체 폭 바닥 시트.
     z-index 70 — 피커(60) · 플로팅 버튼(45) · 지도 패널(40) 위에 앉는다. -->
<div id="fb-card" class="fb-card" role="dialog" aria-label="피드백 보내기" hidden>
  <div class="fb-head">
    <h2 class="fb-title">피드백</h2>
    <span class="grow"></span>
    <button id="fb-x" class="fb-x" type="button" aria-label="닫기">×</button>
  </div>

  <p id="fb-loc" class="fb-loc">
    <span class="fb-loc-k">위치:</span>
    <span id="fb-loc-t" class="fb-loc-t"></span>
    <button id="fb-loc-x" class="fb-loc-x" type="button" aria-label="위치 빼기">×</button>
  </p>

  <input id="fb-name" class="fb-in" type="text" maxlength="40" autocomplete="off"
         aria-label="이름" placeholder="이름 (선택)">
  <textarea id="fb-text" class="fb-in fb-text" maxlength="2000" rows="5"
            aria-label="내용"
            placeholder="읽다가 느낀 점, 이상한 지명, 지도에서 헷갈린 것…"></textarea>

  <!-- 허니팟. 사람 눈에 안 보이는 칸이다 — 채워져 오면 봇으로 본다. -->
  <input id="fb-hp" class="fb-hp" type="text" tabindex="-1" autocomplete="off"
         aria-hidden="true">

  <p id="fb-msg" class="fb-msg" role="status" hidden></p>

  <div class="fb-row">
    <button id="fb-copy" class="fb-btn" type="button" hidden>복사해서 보내기</button>
    <span class="grow"></span>
    <button id="fb-cancel" class="fb-btn" type="button">취소</button>
    <button id="fb-send" class="fb-btn fb-primary" type="button" disabled>보내기</button>
  </div>
</div>

<script type="module" src="app.js?v=__V__"></script>
</body>
</html>
